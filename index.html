<script>
// #resourceModal is position:fixed and needs to stay pinned to the
// viewport. <body> carries a `filter` (for the account theme's UI
// saturation/hue controls), and any element with a filter becomes the
// containing block for its position:fixed descendants — so left as a
// child of body, the modal would end up anchored to body's own
// (page-length) box instead of the viewport. Moving it to be a
// sibling of <body> (a direct child of <html>, which never gets that
// filter) keeps it correctly fixed. Safe: nothing styles it via a
// parent-relative selector, and script access is by ID only.
(function(){ var m = document.getElementById("resourceModal"); if (m) document.documentElement.appendChild(m); })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="community/supabase-client.js"></script>
<script>
// ---------------------------------------------------------------
// Header user search — find a member's profile by username
// ---------------------------------------------------------------
(function () {
  const input = document.getElementById("userSearchInput");
  const btn = document.getElementById("btnUserSearch");
  const results = document.getElementById("userSearchResults");
  if (!input || !btn || !results) return;

  async function runUserSearch() {
    const q = input.value.trim();
    if (!q) { results.classList.remove("show"); results.innerHTML = ""; return; }

    // PostgREST's .or() filter treats "," and "(" / ")" as syntax, so
    // escape any comma the user typed before it reaches the query string.
    const safeQ = q.replace(/,/g, "\\,");

    const { data, error } = await sb
      .from("profiles")
      .select("id,username,display_name,avatar_url")
      .or(`username.ilike.%${safeQ}%,display_name.ilike.%${safeQ}%`)
      .limit(8);

    results.classList.add("show");
    if (error || !data || !data.length) {
      results.innerHTML = '<div class="user-search-empty">No users found.</div>';
      return;
    }

    results.innerHTML = data.map(u =>
      '<a class="user-search-row" href="community/profile.html?user=' + encodeURIComponent(u.username) + '">' +
        avatarHtml(u, 32) +
        '<span class="user-search-name">' + escapeHtml(u.display_name) + ' <em>@' + escapeHtml(u.username) + '</em></span>' +
      '</a>'
    ).join("");
  }

  btn.addEventListener("click", runUserSearch);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); runUserSearch(); }
  });
  document.addEventListener("click", (e) => {
    if (!results.contains(e.target) && e.target !== input && e.target !== btn) {
      results.classList.remove("show");
      results.innerHTML = "";
    }
  });
})();
</script>
<script>
(async () => {
  const user = await getSessionUser();
  if (user) {
    document.getElementById("navLogin").style.display = "none";
    document.getElementById("navSignup").style.display = "none";

    const profile = await getMyProfile();
    if (profile) {
      const [unreadCount, unreadMsgCount] = await Promise.all([
        getUnreadNotificationCount(user.id),
        getUnreadMessageCount(user.id),
      ]);

      let links = "";
      if (profile.role === "developer") {
        links += `<a href="community/developer.html" class="navlink-btn">Developer Panel</a>`;
      }
      if (profile.role === "admin" || profile.role === "developer") {
        links += `<a href="community/admin.html" class="navlink-btn">Admin Panel</a>`;
      }
      links += `<a href="community/messages.html" class="navlink-btn">Messages${unreadBadgeHtml(unreadMsgCount)}</a>`;
      links += `<a href="community/inbox.html" class="navlink-btn">Inbox${unreadBadgeHtml(unreadCount)}</a>`;
      links += `<a href="community/saved.html" class="navlink-btn">Saved</a>`;

      const navLinks = document.getElementById("navLinks");
      navLinks.innerHTML = links;
      navLinks.style.display = "flex";

      const avatarWrap = document.getElementById("navAvatarWrap");
      const avatarTrigger = document.getElementById("navAvatar");
      const displayName = profile.display_name || profile.username || "Account";
      avatarTrigger.innerHTML = `<span style="color:var(--text-1); font-size:13.5px; font-weight:600;">${escapeHtml(displayName)}</span>${avatarHtml(profile, 28)}`;
      avatarTrigger.title = displayName;
      avatarWrap.style.display = "inline-flex";
      document.getElementById("navDivider").style.display = "inline-block";

      // Hover to open (mouse), click to toggle (touch), focus/blur to
      // support keyboard users tabbing through the menu items.
      let avatarCloseTimer = null;
      const openAvatarMenu = () => {
        clearTimeout(avatarCloseTimer);
        avatarWrap.classList.add("is-open");
        avatarTrigger.setAttribute("aria-expanded", "true");
      };
      const closeAvatarMenu = () => {
        avatarWrap.classList.remove("is-open");
        avatarTrigger.setAttribute("aria-expanded", "false");
      };
      const scheduleCloseAvatarMenu = () => {
        clearTimeout(avatarCloseTimer);
        avatarCloseTimer = setTimeout(closeAvatarMenu, 150);
      };

      avatarWrap.addEventListener("mouseenter", openAvatarMenu);
      avatarWrap.addEventListener("mouseleave", scheduleCloseAvatarMenu);
      avatarWrap.addEventListener("focusin", openAvatarMenu);
      avatarWrap.addEventListener("focusout", (e) => {
        if (!avatarWrap.contains(e.relatedTarget)) scheduleCloseAvatarMenu();
      });
      avatarTrigger.addEventListener("click", () => {
        avatarWrap.classList.contains("is-open") ? closeAvatarMenu() : openAvatarMenu();
      });
      document.addEventListener("click", (e) => {
        if (!avatarWrap.contains(e.target)) closeAvatarMenu();
      });

      document.getElementById("navLogoutBtn").addEventListener("click", async () => {
        if (!confirm("Are you sure you want to log out?")) return;
        await sb.auth.signOut();
        window.location.href = "index.html";
      });
    }
  }
})();
</script>
