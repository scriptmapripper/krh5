<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krunker Resource Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120c28">
<meta name="description" content="Crosshairs, CSS, settings, maps, mods and scripts made by the community.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Krunker Resource Hub">
<meta property="og:title" content="Krunker Resource Hub">
<meta property="og:description" content="Crosshairs, CSS, settings, maps, mods and scripts made by the community.">
<meta property="og:image" content="assets/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Krunker Resource Hub">
<meta name="twitter:description" content="Crosshairs, CSS, settings, maps, mods and scripts made by the community.">
<meta name="twitter:image" content="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <header>
    <div class="logo-frame"><img src="assets/logo.png" alt="Krunker Resource Hub" class="logo-img"></div>
    <div class="title-block">
      <div class="brand-title">Krunker Resource Hub</div>
      <div class="tagline">Made by <b>Aura Gangs Team</b></div>
    </div>
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
      <a href="community/login.html" id="navLogin" class="btn-ghost">Login</a>
      <a href="community/signup.html" id="navSignup" class="btn-primary">Sign Up</a>
      <span id="navDivider" style="display:none; width:1px; height:22px; background:var(--border); margin:0 2px;"></span>
      <div id="navLinks" style="display:none; gap:10px; align-items:center;"></div>
      <a href="community/settings.html" id="navAvatar" title="Account Settings" style="display:none; align-items:center; gap:8px; text-decoration:none;"></a>
    </div>
  </header>

  <nav class="quick-links">
    <a class="quick-link-btn" style="--c:var(--green)" href="https://krunker.io" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-play"></i>Play</a>
    <a class="quick-link-btn" style="--c:var(--blue)" href="https://krunker.io/social.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-users"></i>Hub</a>
    <a class="quick-link-btn" style="--c:var(--purple)" href="https://krunker.io/editor.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-pen-ruler"></i>Editor</a>
    <a class="quick-link-btn" style="--c:var(--orange)" href="https://docs.krunker.io" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-book"></i>Docs</a>
    <a class="quick-link-btn" style="--c:var(--cyan)" href="https://krunker.io/viewer.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-cube"></i>Viewer</a>
  </nav>

  <nav class="main-tabs" id="mainTabs"></nav>

  <div class="grid">
    <aside class="panel sidebar">
      <div class="sidebar-label" id="sidebarLabel">Sections</div>
      <ul class="tree" id="sidebarTree"></ul>
    </aside>

    <section class="panel content" id="content"></section>
  </div>

</div>

<div class="modal-overlay" id="resourceModal">
  <div class="resource-modal">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-header">
      <div class="modal-icon" id="modalIcon"></div>
      <div>
        <h3 id="modalTitle"></h3>
        <div class="modal-tags" id="modalTags"></div>
      </div>
    </div>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-features">
      <div class="modal-features-label"><i class="fas fa-star"></i> Main Features</div>
      <ul id="modalFeatures"></ul>
    </div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="community/supabase-client.js"></script>
<script>
(async () => {
  const user = await getSessionUser();
  if (user) {
    document.getElementById("navLogin").style.display = "none";
    document.getElementById("navSignup").style.display = "none";

    const profile = await getMyProfile();
    if (profile) {
      const [unreadCount, unreadMsgCount] = await Promise.all([
        getUnreadNotificationCount(user.id),
        getUnreadMessageCount(user.id),
      ]);

      let links = "";
      if (profile.role === "developer") {
        links += `<a href="community/developer.html" class="navlink-btn">Developer Panel</a>`;
      }
      if (profile.role === "admin" || profile.role === "developer") {
        links += `<a href="community/admin.html" class="navlink-btn">Admin Panel</a>`;
      }
      links += `<a href="community/messages.html" class="navlink-btn">Messages${unreadBadgeHtml(unreadMsgCount)}</a>`;
      links += `<a href="community/inbox.html" class="navlink-btn">Inbox${unreadBadgeHtml(unreadCount)}</a>`;
      links += `<a href="community/saved.html" class="navlink-btn">Saved</a>`;

      const navLinks = document.getElementById("navLinks");
      navLinks.innerHTML = links;
      navLinks.style.display = "flex";

      const avatarLink = document.getElementById("navAvatar");
      const displayName = profile.display_name || profile.username || "Account";
      avatarLink.innerHTML = `<span style="color:var(--text-1); font-size:13.5px; font-weight:600;">${escapeHtml(displayName)}</span>${avatarHtml(profile, 28)}`;
      avatarLink.title = displayName;
      avatarLink.style.display = "inline-flex";
      document.getElementById("navDivider").style.display = "inline-block";
    }
  }
})();
</script>
<script src="crosshair-render.js"></script>
<script src="builder.js"></script>
</body>
</html>
