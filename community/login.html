<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Krunker Resource Hub</title>
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap narrow">
  <div class="topbar">
    <div class="brand"><a href="../index.html">◂ Krunker Resource Hub</a></div>
  </div>

  <div class="card">
    <h1>Login</h1>
    <p class="subtitle">Log in to post, edit, and delete your posts.</p>

    <label>Email</label>
    <input type="email" id="fEmail" placeholder="email@example.com">

    <label>Password</label>
    <input type="password" id="fPassword" placeholder="Your password">

    <button class="btn" id="btnLogin">Login</button>
    <div class="msg" id="msg"></div>

    <div class="divider">or</div>
    <a href="signup.html" class="btn ghost" style="display:block; text-align:center;">Don't have an account? Sign Up</a>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
document.getElementById("btnLogin").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  const email = document.getElementById("fEmail").value.trim();
  const password = document.getElementById("fPassword").value;
  if (!email || !password) {
    msg.className = "msg error show"; msg.textContent = "Please fill in email & password.";
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    msg.className = "msg error show"; msg.textContent = error.message;
    return;
  }
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
