<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krunker Resource Hub</title>
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #dropzone{
    border:2px dashed var(--border-strong); border-radius:10px; padding:22px;
    text-align:center; color:var(--text-2); font-size:14px; cursor:pointer;
    transition:.15s ease;
  }
  #dropzone.drag{ background:rgba(122,150,255,.08); border-color:#7a96ff; color:var(--text-1); }
  #previewGrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr));
    gap:10px; margin-top:12px;
  }
  .preview-thumb{ position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--border); background:#05070f; }
  .preview-thumb img{ width:100%; height:90px; object-fit:cover; display:block; }
  .preview-thumb button{
    position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
    border:none; background:rgba(0,0,0,.7); color:#fff; font-size:12px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .preview-thumb button:hover{ background:var(--red); }
  #fileChip{
    display:none; align-items:center; gap:8px; padding:8px 12px; margin-top:10px;
    border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.03);
    font-size:13.5px; color:var(--text-1);
  }
  #fileChip button{
    margin-left:auto; background:none; border:none; color:var(--text-2); cursor:pointer; font-size:16px;
  }
  #fileChip button:hover{ color:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><a href="../index.html">◂ Krunker Resource Hub</a></div>
    <div class="topnav" id="topnav"></div>
  </div>

  <div class="card">
    <h1>Ready CSS</h1>
    <p class="subtitle">Community-made CSS files. Upload a preview and the file so others can use it.</p>
  </div>

  <div class="card" id="submitCard" style="display:none;">
    <h2>Post Your CSS</h2>

    <label>Name</label>
    <input type="text" id="pTitle" placeholder="CSS name">

    <label>Preview (screenshots)</label>
    <div id="dropzone" tabindex="0">
      Click to upload, drag &amp; drop, or paste (Ctrl+V) one or more screenshots here
    </div>
    <input type="file" id="pPreviewInput" accept="image/*" multiple style="display:none;">
    <div id="previewGrid"></div>

    <label style="margin-top:16px;">File (.txt or .css)</label>
    <input type="file" id="pFileInput" accept=".txt,.css">
    <div id="fileChip">
      <span id="fileChipName"></span>
      <button type="button" id="btnRemoveFile">✕</button>
    </div>

    <label style="margin-top:16px;">Description</label>
    <textarea id="pDescription" placeholder="Describe this CSS, how to install it, etc. (optional)"></textarea>

    <button class="btn green" id="btnPublish" style="margin-top:18px;">Publish</button>
    <div class="msg" id="createMsg"></div>
  </div>

  <div class="card" id="loginPrompt">
    <p class="subtitle" style="margin-bottom:14px;">Log in to post your own CSS.</p>
    <a href="login.html" class="btn ghost" style="display:block; text-align:center; margin-bottom:10px;">Login</a>
    <a href="signup.html" class="btn" style="display:block; text-align:center;">Sign Up</a>
  </div>

  <div class="card" id="logoutCard" style="display:none;">
    <button class="btn logout-btn" id="btnLogout">Logout</button>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
let me = null;
let previewFiles = []; /* array of File objects, images */
let mainFile = null;   /* single File object, .txt or .css */

const CAT = "css-ready";

async function boot() {
  me = await getSessionUser();
  if (me) await getMyProfile(); // triggers ban-check + forced sign-out if this account is banned
  const nav = document.getElementById("topnav");
  nav.innerHTML = "";

  if (me) {
    document.getElementById("logoutCard").style.display = "block";
    document.getElementById("btnLogout").addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm("Are you sure you want to log out?")) return;
      await sb.auth.signOut(); window.location.reload();
    });
    document.getElementById("submitCard").style.display = "block";
    document.getElementById("loginPrompt").style.display = "none";
  }
}

/* ---------- preview images: click / drag / paste ---------- */
const dropzone = document.getElementById("dropzone");
const previewInput = document.getElementById("pPreviewInput");
const previewGrid = document.getElementById("previewGrid");

dropzone.addEventListener("click", () => previewInput.click());

previewInput.addEventListener("change", (e) => {
  addPreviewFiles(Array.from(e.target.files));
  previewInput.value = "";
});

dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("drag");
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/"));
  addPreviewFiles(files);
});

document.addEventListener("paste", (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  const files = items.filter(it => it.type.startsWith("image/")).map(it => it.getAsFile()).filter(Boolean);
  if (files.length) addPreviewFiles(files);
});

function addPreviewFiles(files) {
  files.forEach(file => {
    previewFiles.push(file);
    const url = URL.createObjectURL(file);
    const thumb = document.createElement("div");
    thumb.className = "preview-thumb";
    thumb.innerHTML = `<img src="${url}"><button type="button">✕</button>`;
    thumb.querySelector("button").addEventListener("click", () => {
      const idx = previewFiles.indexOf(file);
      if (idx > -1) previewFiles.splice(idx, 1);
      thumb.remove();
    });
    previewGrid.appendChild(thumb);
  });
}

/* ---------- main file: .txt / .css ---------- */
const fileInput = document.getElementById("pFileInput");
const fileChip = document.getElementById("fileChip");
const fileChipName = document.getElementById("fileChipName");

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  mainFile = file;
  fileChipName.textContent = file.name;
  fileChip.style.display = "flex";
});

document.getElementById("btnRemoveFile").addEventListener("click", () => {
  mainFile = null;
  fileInput.value = "";
  fileChip.style.display = "none";
});

/* ---------- publish ---------- */
document.getElementById("btnPublish").addEventListener("click", async () => {
  const msg = document.getElementById("createMsg");
  const title = document.getElementById("pTitle").value.trim();

  if (!title || !mainFile) {
    msg.className = "msg error show";
    msg.textContent = "Name and a .txt/.css file are required.";
    return;
  }

  const btn = document.getElementById("btnPublish");
  btn.disabled = true; btn.textContent = "Publishing...";

  try {
    /* upload preview images */
    const previewUrls = [];
    for (let i = 0; i < previewFiles.length; i++) {
      const f = previewFiles[i];
      const ext = (f.name.split(".").pop() || "png").toLowerCase();
      const path = `${me.id}/${Date.now()}-${i}.${ext}`;
      const { error: upErr } = await sb.storage.from("post-previews")
        .upload(path, f, { upsert: true, cacheControl: "3600" });
      if (upErr) throw upErr;
      const { data } = sb.storage.from("post-previews").getPublicUrl(path);
      previewUrls.push(data.publicUrl);
    }

    /* upload the main file */
    const fileExt = (mainFile.name.split(".").pop() || "txt").toLowerCase();
    const filePath = `${me.id}/${CAT}-${Date.now()}.${fileExt}`;
    const { error: fileErr } = await sb.storage.from("post-files")
      .upload(filePath, mainFile, { upsert: true, cacheControl: "3600" });
    if (fileErr) throw fileErr;
    const { data: fileData } = sb.storage.from("post-files").getPublicUrl(filePath);

    const content = JSON.stringify({
      file_url: fileData.publicUrl,
      file_name: mainFile.name,
      previews: previewUrls,
      description: document.getElementById("pDescription").value.trim(),
    });

    const { error } = await sb.from("posts").insert({
      author_id: me.id, title, content, status: "published", category: CAT,
    });
    if (error) throw error;

    msg.className = "msg ok show"; msg.textContent = "Posted!";
    document.getElementById("pTitle").value = "";
    document.getElementById("pDescription").value = "";
    previewFiles = []; previewGrid.innerHTML = "";
    mainFile = null; fileInput.value = ""; fileChip.style.display = "none";

    try {
      if (window.parent && typeof window.parent.loadCssGallery === "function") {
        window.parent.loadCssGallery();
      }
    } catch(e) { /* not embedded — ignore */ }
  } catch (err) {
    msg.className = "msg error show"; msg.textContent = err.message || "Something went wrong.";
  } finally {
    btn.disabled = false; btn.textContent = "Publish";
  }
});

boot();
</script>
</body>
</html>
