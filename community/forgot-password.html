<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Krunker Resource Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap narrow">
  <div class="topbar">
    <div class="brand"><a href="../index.html"><img src="../assets/logo.png" alt="Krunker Resource Hub" class="brand-logo">Krunker Resource Hub</a></div>
  </div>

  <div class="card">
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your account email and we'll send you a link to reset your password.</p>

    <div id="requestStep">
      <label>Email</label>
      <input type="email" id="fEmail" placeholder="email@example.com">

      <button class="btn" id="btnSend">Send Reset Link</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="divider">or</div>
    <a href="login.html" class="btn ghost" style="display:block; text-align:center; text-decoration:none;">Back to Login</a>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
document.getElementById("btnSend").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  const email = document.getElementById("fEmail").value.trim();

  if (!email) {
    msg.className = "msg error show"; msg.textContent = "Please enter your email.";
    return;
  }

  const btn = document.getElementById("btnSend");
  btn.disabled = true; btn.textContent = "Sending...";

  const redirectTo = new URL("reset-password.html", window.location.href).href;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

  btn.disabled = false; btn.textContent = "Send Reset Link";

  // Selalu tampilkan pesan sukses generik (jangan bocorkan apakah email terdaftar atau tidak)
  if (error) {
    console.error(error);
  }
  msg.className = "msg ok show";
  msg.textContent = "If an account exists for that email, a password reset link has been sent. Check your inbox (and spam folder).";
  document.getElementById("fEmail").value = "";
});
</script>
</body>
</html>
