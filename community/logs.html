<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History Logs — Krunker Resource Hub</title>
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Khusus halaman ini — sisanya pakai community.css */
  .log-row{
    display:flex; gap:14px; align-items:flex-start;
    border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; background:var(--surface);
  }
  .log-icon{
    flex:0 0 auto; width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; border:1px solid var(--border);
    background:var(--bg-1);
  }
  .log-body{flex:1 1 auto; min-width:0;}
  .log-head{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .log-action{
    padding:3px 9px; border-radius:20px; font-size:11px;
    font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    border:1px solid currentColor;
  }
  .log-line{font-size:14px; color:var(--text-0); margin-top:7px; line-height:1.5; word-break:break-word;}
  .log-line a{color:var(--blue-glow);}
  .log-reason{
    font-size:13px; color:var(--text-1); margin-top:7px; line-height:1.5;
    border-left:2px solid var(--border-strong); padding-left:10px; white-space:pre-wrap;
  }
  .log-time{font-size:11.5px; color:var(--text-2); white-space:nowrap;}
  .log-id{font-size:11px; color:var(--text-2); margin-top:6px; font-family:monospace;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{
    border:1px solid var(--border); border-radius:11px;
    padding:14px 16px; background:var(--bg-1);
  }
  .stat .num{font-family:'Orbitron',sans-serif; font-size:21px; font-weight:800; color:var(--text-0);}
  .stat .lbl{font-size:11.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:.5px; margin-top:4px;}

  .filter-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media(max-width:820px){.filter-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.filter-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><a href="../index.html">◂ Krunker Resource Hub</a></div>
    <div class="topnav" id="topnav"></div>
  </div>

  <div class="card">
    <h1>History Logs</h1>
    <p class="subtitle">
      Every staff action on the community, newest first. This log is append-only —
      nothing here can be edited or deleted from the website, not even by a Developer.
    </p>
    <div class="stat-grid" id="stats">
      <div class="stat"><div class="num">—</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num">—</div><div class="lbl">Last 24h</div></div>
      <div class="stat"><div class="num">—</div><div class="lbl">Last 7 days</div></div>
      <div class="stat"><div class="num">—</div><div class="lbl">Staff active</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Filters</h2>
    <div class="filter-grid">
      <select id="filterAction">
        <option value="all">All actions</option>
        <optgroup label="Posts">
          <option value="post_publish">Published post</option>
          <option value="post_unpublish">Unpublished post</option>
          <option value="post_edit">Edited post</option>
          <option value="post_delete">Deleted post</option>
        </optgroup>
        <optgroup label="Users">
          <option value="user_ban">Banned user</option>
          <option value="user_unban">Unbanned user</option>
          <option value="user_warn">Warned user</option>
        </optgroup>
        <optgroup label="Roles">
          <option value="role_grant_admin">Granted Admin</option>
          <option value="role_revoke_admin">Revoked Admin</option>
        </optgroup>
        <optgroup label="Appeals">
          <option value="appeal_approve">Approved appeal</option>
          <option value="appeal_reject">Rejected appeal</option>
        </optgroup>
        <optgroup label="Comments">
          <option value="comment_delete">Deleted comment</option>
        </optgroup>
      </select>

      <select id="filterActor">
        <option value="all">All staff</option>
      </select>

      <select id="filterRange">
        <option value="all">All time</option>
        <option value="1">Last 24 hours</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>

      <input type="text" id="filterSearch" placeholder="Search target / reason...">
    </div>
    <div class="hint" id="resultCount" style="margin-top:12px;"></div>
  </div>

  <div class="card">
    <h2>Activity</h2>
    <div id="logList"><div class="empty">Loading...</div></div>
    <button class="btn ghost" id="btnMore" style="display:none;">Load more</button>
  </div>

  <div class="card">
    <button class="btn logout-btn" id="btnLogout">Logout</button>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
const PAGE_SIZE = 50;
let allLogs = [];      // semua log yang udah ke-fetch dari server
let shown = PAGE_SIZE; // berapa baris yang lagi ditampilkan
let loadedAll = false;

async function boot() {
  const profile = await requireRole(["admin", "developer"], "dashboard.html");
  if (!profile) return;

  const nav = document.getElementById("topnav");
  let links = `<a href="dashboard.html">Dashboard</a><a href="admin.html">Admin Panel</a>`;
  if (profile.role === "developer") links += `<a href="developer.html">Developer Panel</a>`;
  links += `<span style="color:var(--text-1); font-size:13.5px; margin-left:4px;">${escapeHtml(profile.display_name)} ${roleBadge(profile.role)}</span>`;
  links += `<a href="settings.html" style="margin-left:6px;">Settings</a>`;
  nav.innerHTML = links;

  document.getElementById("btnLogout").addEventListener("click", async (e) => {
    e.preventDefault();
    if (!confirm("Are you sure you want to log out?")) return;
    await sb.auth.signOut(); window.location.href = "../index.html";
  });

  ["filterAction", "filterActor", "filterRange"].forEach(id =>
    document.getElementById(id).addEventListener("change", () => { shown = PAGE_SIZE; render(); })
  );
  document.getElementById("filterSearch").addEventListener("input", () => { shown = PAGE_SIZE; render(); });
  document.getElementById("btnMore").addEventListener("click", () => { shown += PAGE_SIZE; render(); });

  loadLogs();
}

async function loadLogs() {
  /* Ambil 1000 log terbaru sekali jalan, sisanya difilter di client.
     Segini masih enteng banget buat browser, dan bikin filter/search
     kerasa instan tanpa bolak-balik query ke Supabase. */
  const { data, error } = await sb
    .from("activity_logs")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(1000);

  const el = document.getElementById("logList");
  if (error) {
    el.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(error.message)}<br><br>
      Sudah jalanin <code>sql/add_history_logs.sql</code> di Supabase SQL Editor?</div>`;
    return;
  }

  allLogs = data || [];
  loadedAll = allLogs.length < 1000;
  fillActorFilter();
  fillStats();
  render();
}

function fillActorFilter() {
  const sel = document.getElementById("filterActor");
  const seen = new Map();
  allLogs.forEach(l => {
    if (l.actor_id && !seen.has(l.actor_id)) {
      seen.set(l.actor_id, l.actor_display_name || l.actor_username || "Unknown");
    }
  });
  const current = sel.value;
  sel.innerHTML = `<option value="all">All staff</option>` +
    [...seen.entries()]
      .sort((a, b) => a[1].localeCompare(b[1]))
      .map(([id, name]) => `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`)
      .join("");
  sel.value = current || "all";
}

function fillStats() {
  const now = Date.now();
  const within = (days) => allLogs.filter(l => now - new Date(l.created_at).getTime() < days * 864e5).length;
  const staff = new Set(allLogs.map(l => l.actor_id).filter(Boolean)).size;
  const vals = [
    [allLogs.length + (loadedAll ? "" : "+"), "Total"],
    [within(1),  "Last 24h"],
    [within(7),  "Last 7 days"],
    [staff,      "Staff active"],
  ];
  document.getElementById("stats").innerHTML = vals.map(([n, l]) =>
    `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`
  ).join("");
}

function applyFilters() {
  const action = document.getElementById("filterAction").value;
  const actor  = document.getElementById("filterActor").value;
  const range  = document.getElementById("filterRange").value;
  const search = document.getElementById("filterSearch").value.trim().toLowerCase();

  let rows = allLogs;
  if (action !== "all") rows = rows.filter(l => l.action === action);
  if (actor  !== "all") rows = rows.filter(l => l.actor_id === actor);
  if (range  !== "all") {
    const cutoff = Date.now() - Number(range) * 864e5;
    rows = rows.filter(l => new Date(l.created_at).getTime() >= cutoff);
  }
  if (search) {
    rows = rows.filter(l =>
      (l.target_label || "").toLowerCase().includes(search) ||
      (l.reason || "").toLowerCase().includes(search) ||
      (l.actor_username || "").toLowerCase().includes(search) ||
      (l.actor_display_name || "").toLowerCase().includes(search)
    );
  }
  return rows;
}

// Kalimat "siapa melakukan apa ke siapa" per jenis aksi
function describe(l) {
  const target = escapeHtml(l.target_label || "(unknown)");
  const postLink = l.target_type === "post" && l.target_id && l.action !== "post_delete"
    ? `<a href="post.html?id=${encodeURIComponent(l.target_id)}" target="_blank" rel="noopener">${target}</a>`
    : `<strong>${target}</strong>`;
  const userLink = l.target_type === "user" || l.target_type === "appeal"
    ? `<a href="profile.html?user=${encodeURIComponent(l.target_label || "")}" target="_blank" rel="noopener">@${target}</a>`
    : `<strong>${target}</strong>`;

  switch (l.action) {
    case "post_publish":      return `published the post ${postLink}`;
    case "post_unpublish":    return `moved the post ${postLink} back to draft`;
    case "post_edit":         return `edited the post ${postLink}`;
    case "post_delete":       return `permanently deleted the post <strong>${target}</strong>`;
    case "user_ban":          return `banned ${userLink}`;
    case "user_unban":        return `unbanned ${userLink}`;
    case "user_warn":         return `sent a warning to ${userLink}`;
    case "role_grant_admin":  return `promoted ${userLink} to Admin`;
    case "role_revoke_admin": return `revoked Admin from ${userLink}`;
    case "appeal_approve":    return `approved the ban appeal from ${userLink} and unbanned them`;
    case "appeal_reject":     return `rejected the ban appeal from ${userLink}`;
    case "comment_delete":    return `deleted a comment by ${userLink}`;
    default:                  return `performed <strong>${escapeHtml(l.action)}</strong> on <strong>${target}</strong>`;
  }
}

function render() {
  const rows = applyFilters();
  const el = document.getElementById("logList");
  const more = document.getElementById("btnMore");
  const countEl = document.getElementById("resultCount");

  countEl.textContent = rows.length
    ? `Showing ${Math.min(shown, rows.length)} of ${rows.length} matching ${rows.length === 1 ? "entry" : "entries"}.`
    : "";

  if (!rows.length) {
    el.innerHTML = `<div class="empty">No log entries match these filters.</div>`;
    more.style.display = "none";
    return;
  }

  el.innerHTML = rows.slice(0, shown).map(l => {
    const meta = LOG_ACTIONS[l.action] || { label: l.action, icon: "•", color: "var(--text-1)" };
    return `
      <div class="log-row">
        <div class="log-icon" style="color:${meta.color};">${meta.icon}</div>
        <div class="log-body">
          <div class="log-head">
            <span class="log-action" style="color:${meta.color};">${escapeHtml(meta.label)}</span>
            ${l.actor_role ? roleBadge(l.actor_role) : ""}
            <span class="log-time" title="${escapeHtml(formatDateTime(l.created_at))}">${escapeHtml(timeAgo(l.created_at))}</span>
          </div>
          <div class="log-line">
            <strong>${escapeHtml(l.actor_display_name || l.actor_username || "Deleted account")}</strong>
            ${l.actor_username ? `<span style="color:var(--text-2); font-weight:500;">@${escapeHtml(l.actor_username)}</span>` : ""}
            ${describe(l)}
          </div>
          ${l.reason ? `<div class="log-reason">${escapeHtml(l.reason)}</div>` : ""}
          <div class="log-id">${escapeHtml(formatDateTime(l.created_at))}${l.target_id ? " · " + escapeHtml(l.target_id) : ""}</div>
        </div>
      </div>`;
  }).join("");

  more.style.display = rows.length > shown ? "block" : "none";
}

boot();
</script>
</body>
</html>
