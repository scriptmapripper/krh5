<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Krunker Resource Hub</title>
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .dm-layout{ display:flex; gap:0; border:1px solid var(--border); border-radius:14px; overflow:hidden; min-height:520px; }
  .dm-list{ width:290px; flex:none; border-right:1px solid var(--border); overflow-y:auto; max-height:640px; }
  .dm-list-row{
    display:flex; gap:10px; align-items:center; padding:13px 14px; cursor:pointer; text-decoration:none;
    border-bottom:1px solid var(--border); transition:.1s ease;
  }
  .dm-list-row:hover{ background:rgba(255,255,255,.03); }
  .dm-list-row.active{ background:rgba(96,165,250,.09); }
  .dm-list-row.unread .dm-preview-name, .dm-list-row.unread .dm-preview-text{ font-weight:700; color:var(--text-0); }
  .dm-preview-body{ flex:1; min-width:0; }
  .dm-preview-name{ font-size:13.5px; color:var(--text-1); }
  .dm-preview-text{ font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .dm-preview-dot{ width:8px; height:8px; border-radius:50%; background:var(--blue-glow); flex:none; }
  .dm-thread{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .dm-thread-header{ padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .dm-thread-header a{ color:var(--text-1); text-decoration:none; }
  .dm-messages{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; max-height:500px; }
  .dm-bubble-row{ display:flex; }
  .dm-bubble-row.mine{ justify-content:flex-end; }
  .dm-bubble-wrap{ max-width:min(70%, 380px); min-width:0; }
  .dm-bubble{
    padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; display:inline-block; max-width:100%;
  }
  .dm-bubble-row.mine .dm-bubble{ background:var(--blue-glow); color:#05070f; border-bottom-right-radius:4px; }
  .dm-bubble-row:not(.mine) .dm-bubble{ background:var(--surface-2); color:var(--text-1); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .dm-bubble-time{ font-size:10px; color:var(--text-2); margin-top:3px; }
  .dm-thread-input{ display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--border); }
  .dm-thread-input textarea{ flex:1; min-height:44px; max-height:120px; resize:none; margin:0; }
  .dm-thread-input button{ align-self:flex-end; }
  .dm-empty-state{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:13.5px; padding:40px; text-align:center; }
  @media (max-width: 720px){
    .dm-layout{ flex-direction:column; }
    .dm-list{ width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:220px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><a href="../index.html">◂ Krunker Resource Hub</a></div>
    <div class="topnav" id="topnav"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:16px;">Messages</h2>
    <div class="dm-layout">
      <div class="dm-list" id="dmList"><div class="empty">Loading...</div></div>
      <div class="dm-thread" id="dmThread">
        <div class="dm-empty-state">Select a conversation, or visit someone's profile and tap Message.</div>
      </div>
    </div>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const WITH_USERNAME = params.get('with');

let me = null;
let activeConversationId = null;
let pollHandle = null;

async function boot() {
  const profile = await getMyProfile();
  if (!profile) { window.location.href = "login.html"; return; }
  me = await getSessionUser();

  const nav = document.getElementById("topnav");
  let links = ``;
  if (profile.role === "admin" || profile.role === "developer") links += `<a href="admin.html">Admin Panel</a>`;
  if (profile.role === "developer") links += `<a href="developer.html">Developer Panel</a>`;
  links += `<a href="inbox.html" style="margin-left:6px;">Inbox${unreadBadgeHtml(await getUnreadNotificationCount(me.id))}</a>`;
  links += `<a href="saved.html" style="margin-left:6px;">Saved</a>`;
  links += `<a href="dashboard.html" style="margin-left:6px;">Dashboard</a>`;
  nav.innerHTML = links;

  await loadConversationList();

  if (WITH_USERNAME) {
    const { data: target } = await sb.from('profiles').select('*').eq('username', WITH_USERNAME).maybeSingle();
    if (target) {
      const convId = await findOrCreateConversation(target.id);
      openThread(convId, target);
    }
  }
}

function orderedPair(a, b) {
  return a < b ? [a, b] : [b, a];
}

async function findOrCreateConversation(otherUserId) {
  const pair = orderedPair(me.id, otherUserId);
  const u1 = pair[0], u2 = pair[1];
  const { data: existing } = await sb.from('conversations').select('id').eq('user1_id', u1).eq('user2_id', u2).maybeSingle();
  if (existing) return existing.id;

  const { data: created, error } = await sb.from('conversations').insert({ user1_id: u1, user2_id: u2 }).select('id').single();
  if (error) { alert('Could not start conversation: ' + error.message); return null; }
  return created.id;
}

async function loadConversationList() {
  const listEl = document.getElementById('dmList');

  const { data: convos, error } = await sb
    .from('conversations')
    .select('*, user1:profiles!conversations_user1_id_fkey(id,username,display_name,avatar_url), user2:profiles!conversations_user2_id_fkey(id,username,display_name,avatar_url)')
    .or(`user1_id.eq.${me.id},user2_id.eq.${me.id}`)
    .order('last_message_at', { ascending: false });

  if (error) { listEl.innerHTML = '<div class="empty">Failed to load conversations.</div>'; return; }
  if (!convos.length) { listEl.innerHTML = '<div class="empty">No conversations yet.</div>'; return; }

  // One query for every message across all these conversations, instead of
  // 2 extra round-trips per conversation — much faster once you have more
  // than a couple of DMs.
  const convIds = convos.map(c => c.id);
  const { data: allMsgs } = await sb
    .from('messages')
    .select('conversation_id,content,sender_id,created_at,read')
    .in('conversation_id', convIds)
    .order('created_at', { ascending: false });

  const lastByConv = {};
  const unreadByConv = {};
  (allMsgs || []).forEach(m => {
    if (!lastByConv[m.conversation_id]) lastByConv[m.conversation_id] = m; // first hit per conv = newest, thanks to the ORDER BY above
    if (!m.read && m.sender_id !== me.id) unreadByConv[m.conversation_id] = (unreadByConv[m.conversation_id] || 0) + 1;
  });

  const rows = convos.map(c => ({
    conv: c,
    other: c.user1.id === me.id ? c.user2 : c.user1,
    last: lastByConv[c.id] || null,
    unread: unreadByConv[c.id] || 0,
  }));

  listEl.innerHTML = rows.map(r => {
    const activeClass = activeConversationId === r.conv.id ? ' active' : '';
    const unreadClass = r.unread ? ' unread' : '';
    const previewText = r.last ? (r.last.sender_id === me.id ? 'You: ' : '') + escapeHtml(r.last.content) : 'Say hi!';
    const dot = r.unread ? '<div class="dm-preview-dot"></div>' : '';
    return '<div class="dm-list-row' + activeClass + unreadClass + '" data-conv-id="' + r.conv.id + '" data-other-id="' + r.other.id + '" data-other-username="' + escapeHtml(r.other.username) + '" data-other-name="' + escapeHtml(r.other.display_name) + '">' +
      avatarHtml(r.other, 40) +
      '<div class="dm-preview-body"><div class="dm-preview-name">' + escapeHtml(r.other.display_name) + '</div><div class="dm-preview-text">' + previewText + '</div></div>' +
      dot +
      '</div>';
  }).join('');

  listEl.querySelectorAll('.dm-list-row').forEach(row => {
    row.addEventListener('click', () => {
      openThread(row.getAttribute('data-conv-id'), {
        id: row.getAttribute('data-other-id'),
        username: row.getAttribute('data-other-username'),
        display_name: row.getAttribute('data-other-name'),
      });
    });
  });
}

async function openThread(conversationId, otherUser) {
  if (!conversationId) return;
  activeConversationId = conversationId;

  document.querySelectorAll('.dm-list-row').forEach(r => {
    r.classList.toggle('active', r.getAttribute('data-conv-id') === conversationId);
  });

  const threadEl = document.getElementById('dmThread');
  threadEl.innerHTML =
    '<div class="dm-thread-header">' +
      '<a href="profile.html?user=' + encodeURIComponent(otherUser.username) + '">' + avatarHtml(otherUser, 32) + '</a>' +
      '<a href="profile.html?user=' + encodeURIComponent(otherUser.username) + '" style="font-weight:700; font-size:14px;">' + escapeHtml(otherUser.display_name) + '</a>' +
    '</div>' +
    '<div class="dm-messages" id="dmMessages"><div class="empty">Loading...</div></div>' +
    '<div class="dm-thread-input">' +
      '<textarea id="dmInput" placeholder="Write a message..."></textarea>' +
      '<button class="btn" id="btnSendDm" style="width:auto; padding:10px 20px; margin-top:0;">Send</button>' +
    '</div>';

  document.getElementById('btnSendDm').addEventListener('click', sendMessage);
  document.getElementById('dmInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  await refreshMessages();

  if (pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(refreshMessages, 4000);
}

async function refreshMessages() {
  if (!activeConversationId) return;
  const msgsEl = document.getElementById('dmMessages');
  if (!msgsEl) return;

  const { data, error } = await sb
    .from('messages')
    .select('*')
    .eq('conversation_id', activeConversationId)
    .order('created_at', { ascending: true });

  if (error) { msgsEl.innerHTML = '<div class="empty">Failed to load messages.</div>'; return; }

  const wasAtBottom = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 30;

  msgsEl.innerHTML = data.length ? data.map(m => {
    const mineClass = m.sender_id === me.id ? ' mine' : '';
    return '<div class="dm-bubble-row' + mineClass + '"><div class="dm-bubble-wrap"><div class="dm-bubble">' + escapeHtml(m.content) + '</div><div class="dm-bubble-time">' + formatDate(m.created_at) + '</div></div></div>';
  }).join('') : '<div class="empty">No messages yet — say hi!</div>';

  if (wasAtBottom) msgsEl.scrollTop = msgsEl.scrollHeight;

  const unreadIds = data.filter(m => !m.read && m.sender_id !== me.id).map(m => m.id);
  if (unreadIds.length) {
    await sb.from('messages').update({ read: true }).in('id', unreadIds);
    loadConversationList();
  }
}

async function sendMessage() {
  const input = document.getElementById('dmInput');
  const content = input.value.trim();
  if (!content || !activeConversationId) return;

  const btn = document.getElementById('btnSendDm');
  btn.disabled = true;

  const { error } = await sb.from('messages').insert({
    conversation_id: activeConversationId, sender_id: me.id, content: content,
  });

  if (!error) {
    await sb.from('conversations').update({ last_message_at: new Date().toISOString() }).eq('id', activeConversationId);
    input.value = '';
    await refreshMessages();
    loadConversationList();
  } else {
    alert('Failed to send: ' + error.message);
  }
  btn.disabled = false;
}

window.addEventListener('beforeunload', () => { if (pollHandle) clearInterval(pollHandle); });

boot();
</script>
</body>
</html>
