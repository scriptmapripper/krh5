<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosshairs — Krunker Resource Hub</title>
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><a href="../index.html">◂ Krunker Resource Hub</a></div>
    <div class="topnav" id="topnav"></div>
  </div>

  <div class="card">
    <h1>Crosshairs</h1>
    <p class="subtitle">Community-made crosshairs. Build your own at
      <a href="../crosshair-maker.html" style="color:var(--blue-glow); text-decoration:underline;">Custom Crosshair Maker</a>,
      then post it here so others can use it.</p>
  </div>

  <div class="card" id="submitCard" style="display:none;">
    <h2>Post Your Crosshair</h2>
    <label>Title</label>
    <input type="text" id="pTitle" placeholder="Your crosshair name">
    <label>Crosshair Image (PNG)</label>
    <input type="file" id="pImage" accept="image/png">
    <p class="hint">Design it in the Crosshair Maker, then export/upload the PNG here.</p>
    <div id="pPreviewWrap" style="display:none; margin:12px 0;">
      <img id="pPreview" alt="Preview" style="max-width:160px; max-height:160px; border-radius:10px; border:1px solid var(--border); background:#05070f;">
    </div>
    <label>Description</label>
    <textarea id="pDescription" placeholder="Describe this crosshair (optional)"></textarea>
    <button class="btn green" id="btnPublish">Publish Crosshair</button>
    <div class="msg" id="createMsg"></div>
  </div>

  <div class="card" id="loginPrompt">
    <p class="subtitle" style="margin-bottom:14px;">Log in to post your own crosshair.</p>
    <a href="login.html" class="btn ghost" style="display:block; text-align:center; margin-bottom:10px;">Login</a>
    <a href="signup.html" class="btn" style="display:block; text-align:center;">Sign Up</a>
  </div>

  <div class="card" id="logoutCard" style="display:none;">
    <button class="btn logout-btn" id="btnLogout">Logout</button>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
let me = null;
let pendingFile = null; /* File object staged for upload */

function dataURLtoFile(dataUrl, filename) {
  const arr = dataUrl.split(",");
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new File([u8arr], filename, { type: mime });
}

function setPreview(file) {
  pendingFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById("pPreview").src = url;
  document.getElementById("pPreviewWrap").style.display = "block";
}

async function boot() {
  me = await getSessionUser();
  if (me) await getMyProfile(); // triggers ban-check + forced sign-out if this account is banned
  const nav = document.getElementById("topnav");
  nav.innerHTML = "";

  if (me) {
    document.getElementById("logoutCard").style.display = "block";
    document.getElementById("btnLogout").addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm("Are you sure you want to log out?")) return;
      await sb.auth.signOut(); window.location.reload();
    });

    document.getElementById("submitCard").style.display = "block";
    document.getElementById("loginPrompt").style.display = "none";

    /* Handoff from Crosshair Maker's "Post this Crosshair" button */
    const staged = sessionStorage.getItem("pendingCrosshairImage");
    if (staged) {
      sessionStorage.removeItem("pendingCrosshairImage");
      setPreview(dataURLtoFile(staged, "crosshair.png"));
      document.getElementById("pTitle").focus();
    }
  } else {
    /* topnav stays empty — this page sits inside the main site's header already */
  }

  loadFeed();
}

document.getElementById("pImage")?.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) setPreview(file);
});

document.getElementById("btnPublish")?.addEventListener("click", async () => {
  const msg = document.getElementById("createMsg");
  const title = document.getElementById("pTitle").value.trim();
  if (!title || !pendingFile) {
    msg.className = "msg error show"; msg.textContent = "Title & a PNG image are required.";
    return;
  }

  const btn = document.getElementById("btnPublish");
  btn.disabled = true; btn.textContent = "Publishing...";

  const path = `${me.id}/${Date.now()}.png`;
  const { error: uploadError } = await sb.storage
    .from("crosshairs")
    .upload(path, pendingFile, { upsert: true, cacheControl: "3600", contentType: "image/png" });

  if (uploadError) {
    msg.className = "msg error show"; msg.textContent = uploadError.message;
    btn.disabled = false; btn.textContent = "Publish Crosshair";
    return;
  }

  const { data: publicData } = sb.storage.from("crosshairs").getPublicUrl(path);
  const content = JSON.stringify({
    file_url: publicData.publicUrl,
    description: document.getElementById("pDescription").value.trim(),
  });

  const { error } = await sb.from("posts").insert({
    author_id: me.id, title, content, status: "published", category: "crosshair",
  });
  btn.disabled = false; btn.textContent = "Publish Crosshair";
  if (error) {
    msg.className = "msg error show"; msg.textContent = error.message;
    return;
  }
  msg.className = "msg ok show"; msg.textContent = "Your crosshair has been posted!";
  document.getElementById("pTitle").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pDescription").value = "";
  document.getElementById("pPreviewWrap").style.display = "none";
  pendingFile = null;
  loadFeed();
  try {
    if (window.parent && typeof window.parent.loadCrosshairGallery === "function") {
      window.parent.loadCrosshairGallery("crosshair");
    }
  } catch(e) { /* cross-origin or not embedded — ignore */ }
});

async function loadFeed() {
  /* The list view now lives in the "Community Crosshairs" gallery on the
     main placeholder page — publishing here still writes to the posts
     table with category "crosshair", it's just not re-listed here. */
}

boot();
</script>
</body>
</html>
