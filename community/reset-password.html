<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Krunker Resource Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../assets/favicon.ico">
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../assets/site-glow.css">
<script>(function(){try{var v=localStorage.getItem("krh5:reduceEffects");var r=v==="1"||(v!=="0"&&window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);if(r)document.documentElement.setAttribute("data-glow-effects","off");}catch(e){}})();</script>
<script src="../assets/site-glow.js" defer></script>
</head>
<body>
<div class="wrap narrow">
  <div class="topbar">
    <div class="brand"><a href="../index.html"><img src="../assets/logo.png" alt="Krunker Resource Hub" class="brand-logo">Krunker Resource Hub</a></div>
  </div>

  <div class="card">
    <h1>Reset Password</h1>
    <p class="subtitle">Choose a new password for your account.</p>

    <div class="step" id="stepLoading">
      <p class="hint">Verifying your reset link...</p>
    </div>

    <div class="step" id="stepForm">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" id="fPassword" placeholder="Minimum 6 characters">
        <button class="pw-toggle" data-target="fPassword" tabindex="-1"></button>
      </div>

      <label>Confirm New Password</label>
      <div class="pw-wrap">
        <input type="password" id="fPassword2" placeholder="Repeat new password">
        <button class="pw-toggle" data-target="fPassword2" tabindex="-1"></button>
      </div>

      <button class="btn" id="btnReset">Set New Password</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="step" id="stepInvalid">
      <div class="msg error show">This reset link is invalid or has expired. Please request a new one.</div>
      <a href="forgot-password.html" class="btn" style="display:block; text-align:center; text-decoration:none; margin-top:14px;">Request New Link</a>
    </div>

    <div class="step" id="stepDone">
      <div class="msg ok show">Your password has been updated.</div>
      <a href="login.html" class="btn" style="display:block; text-align:center; text-decoration:none; margin-top:14px;">Go to Login</a>
    </div>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
function showStep(id) {
  ["stepLoading", "stepForm", "stepInvalid", "stepDone"].forEach(s => {
    document.getElementById(s).classList.toggle("active", s === id);
  });
}

showStep("stepLoading");

// Supabase memproses access_token/error dari URL hash link email secara otomatis.
// Kalau link valid, event "PASSWORD_RECOVERY" akan terpicu dengan session aktif.
let recoveryReady = false;

sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    recoveryReady = true;
    showStep("stepForm");
  }
});

// Fallback: kalau link error (expired/invalid), Supabase taruh error di hash.
// Kalau setelah sebentar belum dapat PASSWORD_RECOVERY & tidak ada error jelas, cek session biasa.
(async () => {
  const hash = window.location.hash;
  if (hash.includes("error=")) {
    showStep("stepInvalid");
    return;
  }

  await new Promise(r => setTimeout(r, 800));
  if (recoveryReady) return;

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    showStep("stepForm");
  } else {
    showStep("stepInvalid");
  }
})();

document.getElementById("btnReset").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  const password = document.getElementById("fPassword").value;
  const password2 = document.getElementById("fPassword2").value;

  if (!password || !password2) {
    msg.className = "msg error show"; msg.textContent = "Please fill in both fields.";
    return;
  }
  if (password.length < 6) {
    msg.className = "msg error show"; msg.textContent = "Password must be at least 6 characters.";
    return;
  }
  if (password !== password2) {
    msg.className = "msg error show"; msg.textContent = "Passwords do not match.";
    return;
  }

  const btn = document.getElementById("btnReset");
  btn.disabled = true; btn.textContent = "Updating...";

  const { error } = await sb.auth.updateUser({ password });

  if (error) {
    msg.className = "msg error show"; msg.textContent = error.message;
    btn.disabled = false; btn.textContent = "Set New Password";
    return;
  }

  await sb.auth.signOut();
  showStep("stepDone");
});
</script>
</body>
</html>
