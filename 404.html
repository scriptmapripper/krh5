<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Krunker Resource Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .notfound{
    min-height:70vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:40px 20px; gap:16px;
  }
  .notfound .code{
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(64px,14vw,140px);
    line-height:1; letter-spacing:2px; color:var(--text-0);
    background:linear-gradient(180deg, var(--text-0), var(--blue-glow));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(59,130,246,.35);
  }
  .notfound h1{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:var(--text-0); }
  .notfound p{ color:var(--text-1); font-size:14.5px; max-width:440px; }
  .notfound .actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .notfound .btn{
    display:inline-block; padding:10px 20px; border-radius:9px; font-weight:600; font-size:14px;
    text-decoration:none; transition:.15s;
  }
  .notfound .btn.primary{ background:var(--blue); color:#fff; }
  .notfound .btn.primary:hover{ background:var(--blue-glow); }
  .notfound .btn.ghost{ background:var(--surface); color:var(--text-1); border:1px solid var(--border); }
  .notfound .btn.ghost:hover{ border-color:var(--border-strong); color:var(--text-0); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <img src="assets/logo.png" alt="Krunker Resource Hub" class="logo-img">
  </header>

  <div class="notfound">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link might be broken, or the page may have been moved or removed. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn primary">Back to Home</a>
      <a href="/community/dashboard.html" class="btn ghost">Go to Dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
